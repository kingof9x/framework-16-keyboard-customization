[workspace]
resolver = "2"
members = ["core", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[profile.release]
opt-level = 3
lto = true
strip = true

# Keep debug builds usable: the keyboard picture is drawn 30 times a second
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
