[workspace]
resolver = "2"
members = ["core", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
# Agent sessions and local dev: less debug info = faster compile and link.
debug = "line-tables-only"
