[package]
name = "framework-16-keyboard-control"
description = "Windows app to control Framework Laptop 16 keyboard + RGB macropad lighting (f16custom firmware)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "framework-16-keyboard-control"
path = "src/main.rs"

[dependencies]
f16-core = { path = "../core" }
# Same toolkit and settings as the White Rabbit app, so both look alike
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "raw-window-handle-06",
] }
# Draws the keyboard picture
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# Pure-Rust HID backend on Windows: no C compiler or driver install needed.
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
hidapi = "2.6"

[build-dependencies]
slint-build = "1.18"
