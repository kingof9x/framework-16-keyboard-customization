name: Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["firmware/**", "resolume/**"]
  pull_request:
    paths-ignore: ["firmware/**", "resolume/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test + build framework-16-keyboard-control.exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests (effect math + HID message encoding)
        run: cargo test --workspace

      - name: Build release exe
        run: cargo build --release --locked

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: framework-16-keyboard-control-windows
          path: |
            app/target/release/framework-16-keyboard-control.exe
            app/target/installer/*-setup.exe
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: framework-16-keyboard-control-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            **/framework-16-keyboard-control.exe
            **/*-setup.exe
