name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["app/**", "resolume/**"]
  pull_request:
    paths-ignore: ["app/**", "resolume/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build keyboard + macropad UF2
    runs-on: ubuntu-24.04
    # Framework's QMK v0.3.1 Python tooling needs Python < 3.12 (it uses ast.Num),
    # so we don't use the current qmkfm/qmk_cli container.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Download Framework's QMK firmware source
        run: FETCH_ONLY=1 ./firmware/build.sh

      - name: Install QMK Python requirements
        run: pip install qmk -r firmware/.qmk_firmware/requirements.txt

      - name: Build
        run: ./firmware/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: firmware/out/*.uf2
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-uf2
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.uf2"
