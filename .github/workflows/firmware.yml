name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["app/**", "resolume/**"]
  pull_request:
    paths-ignore: ["app/**", "resolume/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build keyboard + macropad UF2
    runs-on: ubuntu-latest
    # Same container Framework uses to build their official firmware
    container: qmkfm/qmk_cli
    steps:
      - uses: actions/checkout@v4

      - name: Download Framework's QMK firmware source
        run: FETCH_ONLY=1 ./firmware/build.sh

      - name: Install QMK Python requirements
        run: |
          pip3 install -r firmware/.qmk_firmware/requirements.txt \
            || pip3 install --break-system-packages -r firmware/.qmk_firmware/requirements.txt \
            || echo "::warning::pip install failed; relying on the packages already in the container"

      - name: Build
        run: ./firmware/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: firmware/out/*.uf2
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-uf2
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.uf2"
